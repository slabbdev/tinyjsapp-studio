name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TINYJS_VERSION: v0.50.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest }
          - { os: windows-latest }
          - { os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux needs the WebKit runtime BEFORE the tinyjs installer runs
      - name: WebKit packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install tinyjs (macOS / Linux)
        if: runner.os != 'Windows'
        run: curl -fsSL https://tinyjs.app/install | sh

      - name: Install tinyjs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TINYJS_VERSION = '${{ env.TINYJS_VERSION }}'
          irm https://tinyjs.app/install.ps1 | iex

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: tinyjs build

      # D4 — notarization runs only when the signing secrets exist; without
      # them the build stays ad-hoc signed (today's default). Sam enables it
      # by adding: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID —
      # plus a Developer ID Application certificate (base64 P12) in
      # MACOS_CERTIFICATE with MACOS_CERTIFICATE_PWD, imported to a temp
      # keychain here. "xcrun notarytool submit --wait" then staples the
      # ticket so Gatekeeper opens the app without warnings.
      - name: Import Developer ID certificate (macOS, optional)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$(openssl rand -hex 16)" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$(openssl rand -hex 16)" build.keychain
          security list-keychains -d user -s build.keychain login.keychain

      - name: Codesign + notarize (macOS, optional)
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app=$(find dist -maxdepth 1 -name "*.app" | head -1 | sed 's|^\./||')
          identity=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          [ -n "$identity" ] || { echo "no Developer ID identity in the keychain"; exit 1; }
          codesign --force --deep --sign "$identity" "dist/$app"
          ditto -c -k --keepParent "dist/$app" /tmp/notarize.zip
          xcrun notarytool submit /tmp/notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "dist/$app"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:LOCALAPPDATA\tinyjs\tinyjs.cmd" build'

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          app=$(find . -maxdepth 1 -name "*.app" | head -1 | sed 's|^\./||')
          ditto -c -k --keepParent "$app" "../tinyjsapp-studio-macos.zip"
          cd ..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath tinyjsapp-studio-windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist
          tar czf ../tinyjsapp-studio-linux.tar.gz *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyjsapp-studio-${{ runner.os }}
          path: tinyjsapp-studio-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: rel
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: TinyJS App Studio ${{ github.ref_name }}
          body: |
            TinyJS App Studio — create tinyjs apps and wrap websites into
            desktop apps, without a terminal.

            **macOS**: unzip and drag to Applications (ad-hoc signed —
            right-click → Open on first launch).
            **Windows**: unzip and run the .exe (WebView2 required —
            preinstalled on Windows 11).
            **Linux**: untar and run (needs libwebkit2gtk-4.1).

            Built with [tinyjs](https://tinyjs.app) — no Electron, no bundled
            browser.
          files: rel/*
