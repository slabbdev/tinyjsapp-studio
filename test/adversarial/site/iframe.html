<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>stranger origin iframe</title></head>
<body>
<script>
'use strict';
// Stranger-origin probe: this frame is served from port 8788, which is NOT
// in the wrap's api.origins. Expected: every path to the backend is denied
// — and this frame must not be gated as the top frame's origin.
//
// T6  · the page-side bridge (window.tiny): either not injected here at
//       all, or every call denied per-origin.
// T6b · the RAW handler (window.__invoke): WebKit exposes the page's
//       message handler to EVERY frame, so a hand-built call from here is
//       the exact vector tinyjs 0.50.1 closed on macOS (before that, a
//       subframe call rode the top frame's gate; replies even settled the
//       top frame's pending calls). On <=0.50.0 this probe LEAKS by
//       design-of-the-era — documented, not a suite failure.
async function probe() {
  const res = { t6: '' };

  // ---- T6: the injected bridge (passive — no raw calls here) ----
  const hasBridge = typeof window.tiny === 'object' && window.tiny && window.tiny.api;
  const call = async (method, params) => {
    try {
      const r = await window.tiny.api.call(method, params);
      return { ok: true, detail: 'resolved:' + JSON.stringify(r).slice(0, 60) };
    } catch (e) { return { ok: false, detail: (e && e.message) || String(e) }; }
  };
  const calls = {
    'win.close': await call('win.close'),
    'fs.read': await call('fs.read', { path: '/etc/hosts' }),
    'store.get': await call('store.get', { key: 'x' }),
    'app.badge': await call('app.badge', { count: 1 }),
  };
  const leaks = Object.entries(calls).filter(([, c]) => c.ok);
  if (!hasBridge) res.t6 = 'ALL BLOCKED — bridge not injected into stranger-origin subframe (window.tiny undefined)';
  else if (leaks.length === 0) res.t6 = 'ALL BLOCKED — bridge present, every call rejected';
  else res.t6 = 'LEAK — executed: ' + leaks.map(([m, c]) => `${m}: ${c.detail}`).join(' | ');

  try { parent.postMessage(JSON.stringify(res), '*'); } catch (e) { /* nothing */ }
  document.title = res.t6.startsWith('ALL BLOCKED') ? 'BLOCKED' : 'LEAK';
}

// ---- T6b: the raw WKScriptMessageHandler vector (the 0.50.1 surface) ----
// Fired ONLY on the parent's trigger, AFTER the verdict report has relayed:
// a denied raw subframe call makes the dev app terminate within seconds
// (runtime quirk, flagged upstream) — firing early killed the app mid-run
// and took the report channel with it. The harness judges this probe by
// external evidence alone: the "denied ... for subframe" line in dev.log
// (gated) versus a /raw-leak hit in the server log (leak).
window.addEventListener('message', (ev) => {
  if (ev.data !== 'fire-raw') return;
  try {
    const mh = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tiny;
    if (mh && typeof mh.postMessage === 'function') {
      mh.postMessage('500:' + JSON.stringify({ method: 'shell.open', params: { url: 'http://127.0.0.1:8788/raw-leak?from=t6b' } }));
      document.title = 'RAW FIRED';
    } else {
      document.title = 'RAW ABSENT';
    }
  } catch (e) {
    document.title = 'RAW THREW';
  }
});
window.addEventListener('load', () => setTimeout(probe, 300));
</script>
</body>
</html>
